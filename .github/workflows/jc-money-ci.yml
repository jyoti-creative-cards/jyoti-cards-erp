# Money integrity — signed ledgers + dues snapshot consistency
name: JC Money CI

on:
  push:
    branches: [main]
    paths:
      - "JC/backend/**"
      - ".github/workflows/jc-money-ci.yml"
  pull_request:
    paths:
      - "JC/backend/**"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JC/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pytest
      - name: Unit tests (signed + stock helpers)
        run: pytest -q tests/test_money_signed.py tests/test_stock_integrity.py

  integrity:
    runs-on: ubuntu-latest
    needs: unit
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    defaults:
      run:
        working-directory: JC/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pytest
      - name: Live dues + stock reconcile (API)
        env:
          ADMIN_API_KEY: ${{ secrets.JC_ADMIN_API_KEY }}
          API_BASE: ${{ secrets.JC_API_BASE }}
        run: |
          if [ -z "${ADMIN_API_KEY}" ]; then
            echo "JC_ADMIN_API_KEY not set — skip live API check"
            exit 0
          fi
          python - <<'PY'
          import json, os, urllib.request, sys
          key = os.environ["ADMIN_API_KEY"]
          base = (os.environ.get("API_BASE") or "https://jc-api-production.up.railway.app/api/v1").rstrip("/")
          headers = {"X-Admin-Key": key}
          def get(path):
              req = urllib.request.Request(f"{base}{path}", headers=headers)
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.loads(r.read().decode())
          data = get("/finance/dues/integrity")
          print(json.dumps(data, indent=2))
          if not data.get("ok"):
              print("FAIL dues", data.get("errors"))
              sys.exit(1)
          rec = get("/finance/reconcile")
          print(json.dumps({k: rec.get(k) for k in ("ok","stock_mismatch_count","freight_mismatch_count")}, indent=2))
          if rec.get("stock_mismatch_count", 0) > 0:
              print("FAIL stock", rec.get("stock_mismatches")[:5])
              sys.exit(1)
          if not rec.get("ok"):
              # freight/money already covered; soft-fail freight only if money ok
              if not rec.get("money", {}).get("ok", True):
                  print("FAIL reconcile money", rec)
                  sys.exit(1)
          print("OK dues + stock integrity")
          PY
